<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحميل المادة...</title>
    <link rel="icon" type="image/svg+xml" href="shared/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link rel="stylesheet" href="shared/styles.css">

    <!-- Supabase Integration -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="shared/supabase-config.js"></script>
</head>

<body>

    <div id="loading-screen">
        <div class="loader-content">
            <div class="loader-spinner"></div>
            <h2>جاري تحميل المادة...</h2>
            <p>تجهيز الامتحانات</p>
        </div>
    </div>

    <div class="bg-animation">
        <div class="shape circle shape-1"></div>
        <div class="shape square shape-2"></div>
        <div class="shape circle shape-3"></div>
        <div class="shape square shape-4"></div>
    </div>

    <div id="landing-page">
        <div class="landing-container">
            <div class="landing-header">
                <a href="index.html" class="back-to-home">
                    <i class="fas fa-arrow-right"></i> العودة للرئيسية
                </a>
                <h1 id="subject-title"><i class="fas fa-graduation-cap"></i> اسم المادة</h1>
                <p>اختر الوضع المناسب للدراسة</p>
            </div>

            <div class="mode-cards" id="mode-cards-container">
                <!-- Dynamic cards will load here -->
            </div>

            <div class="landing-theme-switcher">
                <span>المظهر:</span>
                <button onclick="setTheme('')" title="داكن"><i class="fas fa-moon"></i></button>
                <button onclick="setTheme('light-mode')" title="فاتح"><i class="fas fa-sun"></i></button>
                <button onclick="setTheme('pro-mode')" title="Pro"><i class="fas fa-gem"></i></button>
                <button onclick="setTheme('contrast-mode')" title="تباين"><i class="fas fa-adjust"></i></button>
            </div>
            
            <div class="hub-footer" style="margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 15px;">
                <div class="support-contact">
                    في حالة وجود مشكلة أو اقتراح بخصوص الموقع، 
                    <a href="https://wa.me/201091913836?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D9%8B%D8%8C%20%D8%B9%D9%86%D8%AF%D9%8Composition%20%D9%85%D8%B4%D9%83%D9%84%D8%A9%20%D8%A3%D9%88%20%D8%A7%D9%82%D8%AA%D8%B1%D8%A7%D8%AD%20%D8%A8%D8%AE%D8%B5%D9%88%D8%B5%20%D9%85%D9%88%D9%82%D8%B9%20Bsmaga-Zone" target="_blank">
                        تواصل معي <i class="fab fa-whatsapp"></i>
                    </a>
                </div>
                <div style="margin-top: 10px; opacity: 0.7; font-size: 0.9rem; direction: ltr; font-family: sans-serif;">
                    Created by Hazem Anter
                </div>
            </div>
        </div>
    </div>

    <script>
        // Theme Management
        const THEME_KEY = 'exam_theme';
        function setTheme(name) {
            document.body.classList.remove('light-mode', 'pro-mode', 'contrast-mode');
            if (name) document.body.classList.add(name);
            localStorage.setItem(THEME_KEY, name);
        }
        function loadTheme() {
            const saved = localStorage.getItem(THEME_KEY);
            if (saved) setTheme(saved);
        }

        let activeExams = [];
        let currentSubject = null;

        async function initDynamicSubject() {
            const client = typeof getSupabaseClient === 'function' ? getSupabaseClient() : null;
            if (!client) {
                console.error("Supabase client not loaded.");
                setTimeout(() => document.getElementById('loading-screen').classList.add('hidden'), 600);
                return;
            }

            try {
                // Get subject slug from URL query params
                const urlParams = new URLSearchParams(window.location.search);
                const slug = urlParams.get('slug');
                if (!slug) {
                    alert("المادة غير محددة!");
                    window.location.href = "index.html";
                    return;
                }

                // Fetch subject details
                const { data: subject, error: subError } = await client
                    .from('subjects')
                    .select('*')
                    .eq('slug', slug)
                    .single();

                if (subError || !subject) throw subError || new Error("المادة غير موجودة");
                currentSubject = subject;

                // Update title & headers
                document.title = subject.name;
                document.getElementById('subject-title').innerHTML = `<i class="fas fa-${subject.icon || 'book'}"></i> ${subject.name}`;

                // Fetch exams for this subject
                const { data: exams, error: examsError } = await client
                    .from('exams')
                    .select('*')
                    .eq('subject_id', subject.id)
                    .eq('is_active', true)
                    .order('id', { ascending: true });

                if (examsError) throw examsError;
                activeExams = exams || [];

                await renderSubjectModes();
            } catch (e) {
                console.error("Error loading subject details:", e);
                alert("حدث خطأ أثناء تحميل بيانات المادة: " + e.message);
                window.location.href = "index.html";
            } finally {
                setTimeout(() => document.getElementById('loading-screen').classList.add('hidden'), 600);
            }
        }

        async function checkFileExists(url) {
            try {
                const response = await fetch(url, { method: 'HEAD' });
                return response.ok;
            } catch {
                return false;
            }
        }

        async function renderSubjectModes() {
            const container = document.getElementById('mode-cards-container');
            container.innerHTML = '';

            // Check if mindmap file exists
            const slugMapping = {
                'subject2': 'الخريطة_الذهنية_بحث2.html',
                'subject3': 'الخريطة_الذهنية_مجتمعات.html',
                'subject4': 'الخريطة_الذهنية_جماعات.html',
                'subject5': 'الخريطة_الذهنية_ذوي.html',
                'subject6': 'الخريطة_الذهنية_تقويم.html',
                'subject7': 'الخريطة_الذهنية_تنمية.html'
            };
            
            let mindmapUrl = slugMapping[currentSubject.slug] || `الخريطة_الذهنية_${currentSubject.slug}.html`;
            if (currentSubject.slug === 'subject1') mindmapUrl = 'الخريطة_الذهنية.html';

            const hasMindmap = await checkFileExists(mindmapUrl);

            if (hasMindmap) {
                container.innerHTML += `
                    <div class="mode-card mindmap-card">
                        <div class="card-icon"><i class="fas fa-project-diagram"></i></div>
                        <h2>كبسولة المراجعة</h2>
                        <div class="card-buttons">
                            <button class="card-btn mindmap-btn" onclick="window.location.href='${mindmapUrl}'">
                                <i class="fas fa-project-diagram"></i> عرض الكبسولة
                            </button>
                        </div>
                    </div>
                `;
            }

            // Render exams
            if (activeExams.length === 0) {
                container.innerHTML += `
                    <div style="grid-column: 1/-1; text-align: center; padding: 20px; color: var(--text-color); opacity: 0.7;">
                        <i class="fas fa-info-circle" style="font-size: 2rem; margin-bottom: 10px;"></i>
                        <p>لا توجد امتحانات مضافة لهذه المادة بعد</p>
                    </div>
                `;
                return;
            }

            activeExams.forEach((exam) => {
                let examUrl = `exam.html?slug=${exam.slug}`;
                
                container.innerHTML += `
                    <div class="mode-card exam-card">
                        <div class="card-icon"><i class="fas fa-file-alt"></i></div>
                        <h2>${exam.title}</h2>
                        <div class="card-buttons">
                            <button class="card-btn exam-btn" onclick="window.location.href='${examUrl}'">
                                <i class="fas fa-book-reader"></i> ${exam.title}
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadTheme();
            initDynamicSubject();
        });

        window.setTheme = setTheme;
    </script>
</body>

</html>
